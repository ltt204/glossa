services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    container_name: glossa_db
    hostname: glossa_db
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glossa
    ports:
      - "5435:5432"   # host:5435 → container:5432
    volumes:
      - glossa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - glossa_network

  # ── Go backend (dev, with hot reload) ──────────────────────
  backend:
    container_name: glossa_backend
    hostname: glossa_backend
    build:
      context: ./backend
      target: dev          # uses the "dev" stage in the Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/glossa_backend.env
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy   # wait until postgres is ready
    networks:
      - glossa_network

volumes:
  glossa_pg:
  backend_tmp:

networks:
  glossa_network:

